services:
  mariadb:
    image: mariadb:11.4
    ports:
      - "3306:3306"
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: developer_blog
      MARIADB_USER: user
      MARIADB_PASSWORD: userpass
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
